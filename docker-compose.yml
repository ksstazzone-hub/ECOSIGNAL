version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ecosignal-postgres
    environment:
      POSTGRES_DB: ecosignal
      POSTGRES_USER: ecosignal
      POSTGRES_PASSWORD: ecosignal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosignal -d ecosignal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
